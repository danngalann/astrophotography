services:
  astrophotography:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astrophotography
    ports:
      - "${ASTRO_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
